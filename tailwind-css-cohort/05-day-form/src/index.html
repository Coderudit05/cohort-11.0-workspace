<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="output.css" />
    <script
      src="https://kit.fontawesome.com/f12c1313f0.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div
      class="min-h-screen flex items-center justify-center bg-gradient-to-b from-gray-900 to-gray-600 bg-gradient-to-r"
    >
      <div class="w-lg rounded-lg bg-white p-10">
        <h1 class="text-3xl font-bold text-black/70">Welcome Back</h1>
        <p class="text-2xl text-gray-500 mb-6">
          Singin to your account to continue
        </p>

        <form action="" class="">
          <div class="flex flex-col mb-8">
            <label for="email" class="text-lg">Email Address</label>
            <input
              id="email"
              type="email"
              placeholder="Enter Your Email"
              class="border-2 border-gray-400/50 px-4 py-2 rounded-lg"
            />
          </div>

          <div class="flex flex-col mb-2">
            <label for="password" class="text-lg">Enter Your Password</label>
            <input
              id="password"
              type="password"
              placeholder="Enter Your Password"
              class="border-2 border-gray-400/50 px-4 py-2 rounded-lg"
            />
          </div>
          <a href="#" class="text-[#A38AF1] hover:text-[#4F46E4] duration-300"
            >forgot password <i class="fa-solid fa-arrow-right"></i
          ></a>

          <div class="flex items-center justify-around mt-8">
            <button class="bg-[#A38AF1] px-10 py-2 rounded-lg cursor-pointer text-white">Sign In</button>
            <button class="border-2 border-[#A38AF1] px-10 py-2 rounded-lg cursor-pointer text-[#A38AF1]">Create Account</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
