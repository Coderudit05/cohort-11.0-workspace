<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        
        .btn::before{
            content: '';
            height: 100%;
            width: 0%;
            background-color: aquamarine;
            position: absolute;

            z-index: -1;
            left: 0;
            top: 0;

            transition: width 0.3s ease-in-out;
        }

        .btn:hover::before{
            width: 100%;
        }

        .btn:hover{
            color: black;
        }
    </style>
  </head>
  <body class="bg-slate-800">
    <div class="h-screen flex items-center justify-center">
      <button class="bg-indigo-500 px-4 py-2 rounded-md text-white cursor-pointer btn relative z-10 overflow-hidden duration-300 ">Hover Me</button>
    </div>
  </body>
</html>
