<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Hero Section</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <header>
        <div class="logo">CRYPTO.</div>

        <nav class="menu" aria-label="Primary navigation">
          <a href="#">Home</a>
          <a href="#">Services</a>
          <a href="#">About</a>
          <a href="#">What's new?</a>
        </nav>
        <a class="button" href="#">Explore now</a>
      </header>

      <main class="hero">
        <section class="hero-left">
          <p class="small-text">KEEP YOUR MONEY SAFE <span>!</span></p>
          <h1>
            Best crypto
            <span>investing platform</span>
            <strong>for your future.</strong>
          </h1>

          <div class="user-row">
            <div class="avatars" aria-label="Realtime users">
              <img class="avatar" src="https://i.pravatar.cc/80?img=11" alt="User avatar" />
              <img class="avatar" src="https://i.pravatar.cc/80?img=12" alt="User avatar" />
              <img class="avatar" src="https://i.pravatar.cc/80?img=13" alt="User avatar" />
              <img class="avatar" src="https://i.pravatar.cc/80?img=14" alt="User avatar" />
              <img class="avatar" src="https://i.pravatar.cc/80?img=15" alt="User avatar" />
              <img class="avatar" src="https://i.pravatar.cc/80?img=16" alt="User avatar" />
            </div>
            <div class="users">168K+<span>Realtime Users</span></div>
          </div>

          <div class="intro-row">
            <a class="round-link" href="#" aria-label="Get started">&#8599;</a>
            <p>
              Polkadot unites and secures a growing ecosystem of specialized
              blockchains called parachains. Apps and services on Polkadot can.
            </p>
          </div>
        </section>

        <section class="hero-right" aria-label="Crypto mobile app preview">
          <span class="big-word">TRADE</span>
          <span class="orbit orbit-one"></span>
          <span class="orbit orbit-two"></span>
          <span class="dot dot-one"></span>
          <span class="dot dot-two"></span>
          <img src="../assets/mobile-1.png" alt="Crypto app screens" />
        </section>
      </main>
    </div>
  </body>
</html>
