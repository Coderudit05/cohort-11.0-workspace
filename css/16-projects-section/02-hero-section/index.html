<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head> 
  <body>
    <header class="">
      <div id="logo">
        <svg
          width="250"
          height="80"
          viewBox="0 0 280 80"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <!-- Logo Icon -->
          <path
            d="M72 16L54 26V46L72 56"
            stroke="#7367F0"
            stroke-width="8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <path
            d="M72 16L86 24"
            stroke="#7367F0"
            stroke-width="8"
            stroke-linecap="round"
          />

          <path
            d="M72 56L86 48"
            stroke="#7367F0"
            stroke-width="8"
            stroke-linecap="round"
          />

          <!-- Text -->
          <text
            x="100"
            y="49"
            font-family="Inter, Arial, sans-serif"
            font-size="28"
            font-weight="700"
            fill="#1B2338"
          >
            Crafto
          </text>
        </svg>
      </div>

      <nav class="">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Service</a>
        <a href="#">Portfolio</a>
        <a href="#">Blog</a>
        <a href="#">Contact</a>
      </nav>

      <div id="nav-btn">
        <button class="">Get Started</button>
      </div>
    </header>

    <section id="hero" class="">
      <div id="hero-wrapper">
        <div id="left">
          <span id="status" class="">Design.Develop.Deliver</span>
          <h1>
            Build Stunning <br />
            Websites <br /><span>That Stand Out.</span>
          </h1>
          <p id="para">
            We help business and Startup build beautiful, fast, and responsive
            websites that drive real results
          </p>

          <div class="" id="hero-btns">
            <button id="btn1">Get Started</button>
            <button id="btn2">Watch Video</button>
          </div>
        </div>
        <div id="right">
          <img src="./assets/right-img.png" alt="" />
        </div>
      </div>
    </section>
  </body>
</html>
