<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        *{

            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,body{
            height: 100%;
        }

        .box {
            background-color: purple;
            height: 200px;
            width: 200px;
            border: 20px solid black;
            padding: 40px;
            margin-left: 50px;

            /* before */
            /* box height => content (200px) + border(20px) + padding(40px) => 260px*/
            /* box width => content (200px) + border(20px) + padding(40px) => 260px*/

            /* after */
            /* box height => content (140px) +  border(20px) + padding(40px) => 260px*/
            /* box width => content (200px) + border(20px) + padding(40px) => 260px*/
        }
    </style>
</head>

<body>

    <div class="box">Hello this is the box</div>

</body>

</html>
