<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;

            background-color: gray;
        }

        .parent {
            height: 600px;
            width: 600px;
            background-color: black;
            position: relative;

        }

        .box {
            height: 200px;
            width: 200px;
            background-color: blueviolet;

            position: absolute;
            bottom: 0;
            right: 0;
        }
    </style>
</head>

<body>

    <div class="parent">
        <div class="box"></div>
    </div>

</body>

</html>
