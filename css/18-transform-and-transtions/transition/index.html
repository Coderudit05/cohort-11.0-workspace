<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        width: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: black;
      }

      button {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 20px;
        position: relative;

        overflow: hidden;
        z-index: 1;
      }

      button::before {
        content: "";
        height: 100%;
        width: 0%;
        background-color: blueviolet;
        position: absolute;

        top: 0;
        left: 0;
        z-index: -1;

        transition-property: width;
        transition-duration: 5s;
        transition-timing-function: linear;

        /* transition-timing-function: ease-in-out; */
        /* transition-timing-function: ease-in; */
        /* transition-timing-function: ease-out; */
        /* transition-delay: 1s; */

        /* Shortcut */

        transition: width 0.3s linear;

      }

      button:hover {
        color: white;
      }

      button:hover::before {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <button class="">Hover Me</button>
  </body>
</html>
